<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Explore street food spots — StreetBowl</title>
<meta name="description" content="Browse hundreds of street food vendors across Nigeria — filter by city, dish or vibe." />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./input.css">
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:'#1a0f0a', cream:'#fdf6ec', chili:'#e3431f', ember:'#f57c1f', palm:'#1f6b3a', mustard:'#f2b705' },
    fontFamily: { display:['Fraunces','serif'], sans:['Inter','sans-serif'] },
  } } }
</script>
</head>
<body class="bg-cream text-ink font-sans">
<div id="nav"></div>

<section class="max-w-6xl mx-auto px-5 pt-10 pb-6">
  <p class="text-chili font-semibold text-sm uppercase tracking-wider">Explore</p>
  <h1 class="font-display font-black text-4xl md:text-6xl mt-1">Every spot worth a detour.</h1>
  <p class="mt-3 text-ink/70 max-w-2xl">Filter by city or dish. All vendors are visited by a real human before they land here.</p>

  <div class="mt-8 flex flex-col md:flex-row gap-3">
    <div class="flex-1 flex items-center gap-3 bg-white border border-ink/10 rounded-xl px-4 py-3">
      <svg class="w-5 h-5 text-ink/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="Search vendor, dish, neighbourhood…" class="w-full bg-transparent outline-none placeholder:text-ink/40" />
    </div>
    <select id="city-filter" class="bg-white border border-ink/10 rounded-xl px-4 py-3 font-medium">
      <option value="">All cities</option>
    </select>
    <select id="type-filter" class="bg-white border border-ink/10 rounded-xl px-4 py-3 font-medium">
      <option value="">All food types</option>
    </select>
  </div>

  <div id="chips" class="mt-4 flex flex-wrap gap-2"></div>
</section>

<section class="max-w-6xl mx-auto px-5 pb-24">
  <p id="count" class="text-sm text-ink/60 mb-4"></p>
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <p id="empty" class="hidden text-center py-20 text-ink/50">No spots match that. Try another dish?</p>
</section>

<div id="footer"></div>

<script src="./data.js"></script>
<script src="./app.js"></script>
<script>
  renderNav('explore');
  renderFooter();
  renderExplore();
</script>
</body>
</html>
